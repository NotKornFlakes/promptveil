name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install -e . pytest
      - run: pytest -q
      - run: node --test tests/web_engine.test.mjs tests/extension_crypto.test.mjs
      - name: Extension engine is in sync with web page
        run: |
          python3 scripts/build_extension.py
          git diff --exit-code extension/engine.js
