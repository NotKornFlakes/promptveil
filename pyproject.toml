[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptveil"
version = "0.1.1"
description = "Redact sensitive data before you prompt an AI, then restore it in the answer. 100% local."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
keywords = ["privacy", "dlp", "redaction", "pii", "secrets", "llm", "ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Environment :: Console",
]

[project.scripts]
promptveil = "promptveil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
